name: build

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  managed:
    name: Build managed (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/RgbFxBridge.sln

      - name: Build
        run: dotnet build src/RgbFxBridge.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/RgbFx.LampArray.Protocol.Tests/RgbFx.LampArray.Protocol.Tests.csproj -c Release --verbosity normal

      - name: Publish HAL (win-x86 self-contained)
        run: >
          dotnet publish tools/AuraCapabilityDump/AuraCapabilityDump.csproj
          -c Release -r win-x86 --self-contained true
          -o artifacts/package/hal

      - name: Publish UI
        run: >
          dotnet publish src/RgbFx.UI/RgbFx.UI.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/package/app
          /p:PublishHalHost=false

      - name: Publish Setup
        run: >
          dotnet publish src/RgbFx.Setup/RgbFx.Setup.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/package

      - name: Stage portable layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          Copy-Item -Recurse artifacts/package/app artifacts/portable/app
          Copy-Item -Recurse artifacts/package/hal artifacts/portable/hal

      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: RgbFxBridge-portable-win-x64
          path: artifacts/portable/**

      - name: Upload setup package
        uses: actions/upload-artifact@v4
        with:
          name: RgbFxBridge-setup-win-x64
          path: |
            artifacts/package/RgbFx.Setup.exe
            artifacts/package/app
            artifacts/package/hal

  driver-check:
    name: Driver sources present
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify driver tree
        shell: pwsh
        run: |
          $required = @(
            "src/RgbFx.Driver/vhf_lamparray.c",
            "src/RgbFx.Driver/lamp_array_descriptor.h",
            "src/RgbFx.Driver/RgbFx.Driver.inf",
            "scripts/build-driver.ps1"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing $f" }
            Write-Host "OK $f"
          }
          Write-Host "Driver sources verified. Full KMDF build requires WDK (local scripts/build-driver.ps1)."
